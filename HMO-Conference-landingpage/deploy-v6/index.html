<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HMO Scientific Conference 2026 — VNU-HUS · Abstracts v6</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
  rel="stylesheet"
/>

<!-- Tailwind (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Montserrat', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          display: ['Montserrat', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        colors: {
          navy:   'var(--c-navy)',
          ocean:  'var(--c-ocean)',
          sky:    'var(--c-sky)',
          coral:  'var(--c-coral)',
          mist:   '#F5F7FA',
        },
        boxShadow: {
          card: '0 8px 24px -12px rgba(10,46,92,.18), 0 2px 6px -2px rgba(10,46,92,.08)',
          hi:   '0 24px 60px -24px rgba(10,46,92,.45)',
          coral:'0 14px 30px -10px rgba(240,120,80,.55)',
        },
      },
    },
  };
</script>

<style>
  :root{
    --c-navy:#0A2E5C;
    --c-ocean:#1B4E8F;
    --c-sky:#60C0F0;
    --c-coral:#F07850;
    --c-mist:#F5F7FA;
  }
  html{ scroll-behavior:smooth; scroll-padding-top:80px; }
  body{ font-family:'Montserrat',ui-sans-serif,system-ui,sans-serif; color:#0f172a; background:#fff; }

  /* Reveal-on-scroll */
  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .8s cubic-bezier(.22,1,.36,1), transform .8s cubic-bezier(.22,1,.36,1); will-change:opacity,transform; }
  .reveal.in{ opacity:1; transform:none; }
  .reveal-stagger > *{ opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1); }
  .reveal-stagger.in > *{ opacity:1; transform:none; }
  .reveal-stagger.in > *:nth-child(1){ transition-delay:.05s; }
  .reveal-stagger.in > *:nth-child(2){ transition-delay:.12s; }
  .reveal-stagger.in > *:nth-child(3){ transition-delay:.19s; }
  .reveal-stagger.in > *:nth-child(4){ transition-delay:.26s; }
  .reveal-stagger.in > *:nth-child(5){ transition-delay:.33s; }
  .reveal-stagger.in > *:nth-child(6){ transition-delay:.4s;  }
  .no-anim .reveal, .no-anim .reveal-stagger > *{ opacity:1 !important; transform:none !important; transition:none !important; }

  /* Hero ocean motion */
  @keyframes wavePan { 0%{ transform:translateX(0); } 100%{ transform:translateX(-50%); } }
  @keyframes pulseDot { 0%,100%{ transform:scale(1); opacity:.9; } 50%{ transform:scale(1.35); opacity:.5; } }
  @keyframes float-y { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  @keyframes shimmer { 0%{ background-position:-200% 0; } 100%{ background-position:200% 0; } }
  .float-y{ animation:float-y 6s ease-in-out infinite; }
  .no-anim .float-y{ animation:none; }

  /* Hero gradient + grid */
  .hero-bg{
    background:
      radial-gradient(1200px 600px at 80% 10%, rgba(96,192,240,.35), transparent 60%),
      radial-gradient(900px 500px at 10% 90%, rgba(240,120,80,.18), transparent 60%),
      linear-gradient(135deg, var(--c-navy) 0%, var(--c-ocean) 65%, #0e3b73 100%);
  }
  .hero-grid{
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  }

  /* Topic card hover */
  .topic-card{ transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s; }
  .topic-card:hover{ transform: translateY(-6px); box-shadow: 0 24px 50px -20px rgba(10,46,92,.35); }
  .topic-card:hover .topic-icon{ background: var(--c-coral); color:#fff; transform:scale(1.06); }
  .topic-icon{ transition: background .35s, color .35s, transform .35s; }

  /* Sticky nav */
  .nav-shadow{ box-shadow: 0 1px 0 rgba(10,46,92,.06), 0 8px 24px -16px rgba(10,46,92,.25); }

  /* Form */
  .field{ transition: border-color .2s, box-shadow .2s, background .2s; }
  .field:focus{ border-color: var(--c-ocean); box-shadow: 0 0 0 4px rgba(27,78,143,.12); background:#fff; }
  .field.err{ border-color:#dc2626; box-shadow: 0 0 0 4px rgba(220,38,38,.12); }

  /* Coral CTA */
  .btn-coral{
    background: var(--c-coral);
    transition: transform .2s, box-shadow .25s, filter .2s;
    box-shadow: 0 14px 30px -10px rgba(240,120,80,.55);
  }
  .btn-coral:hover{ transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 18px 36px -12px rgba(240,120,80,.7); }
  .btn-coral:active{ transform: translateY(0); }

  /* Underline link */
  .link-u{ background-image: linear-gradient(var(--c-coral),var(--c-coral)); background-repeat:no-repeat; background-position:0 100%; background-size:0 2px; transition: background-size .3s; }
  .link-u:hover{ background-size:100% 2px; }

  /* Toast */
  @keyframes toastIn { from{ opacity:0; transform:translateY(20px) translateX(-50%);} to{ opacity:1; transform:translateY(0) translateX(-50%);} }
  .toast{ animation: toastIn .35s cubic-bezier(.22,1,.36,1) both; }

  /* Wave divider svg color follow */
  .wave-fill{ fill: var(--c-mist); }

  /* Discipline images (v2) — feathered, blended into navy background */
  .disc-img{
    -webkit-mask-image: radial-gradient(120% 115% at 78% 50%, #000 34%, rgba(0,0,0,.55) 56%, transparent 82%);
            mask-image: radial-gradient(120% 115% at 78% 50%, #000 34%, rgba(0,0,0,.55) 56%, transparent 82%);
    filter: saturate(.85) contrast(1) brightness(1.08);
    mix-blend-mode: screen;
    opacity:.95;
  }
  /* uniform navy color-grade laid over the whole image band */
  .disc-grade{
    background: linear-gradient(180deg, rgba(10,26,53,.3), rgba(13,35,64,.18) 50%, rgba(10,26,53,.32));
    mix-blend-mode: multiply;
  }
  .disc-cap{
    font-family:'Playfair Display', Georgia, serif; font-style:italic; font-weight:500;
    font-size:clamp(18px,2.2vw,32px); line-height:1.1; color:rgba(255,255,255,.97);
    letter-spacing:.01em; z-index:3; padding-right:.55em;
    border-right:2px solid rgba(96,192,240,.9);
    text-shadow:0 2px 18px rgba(4,12,28,.9),0 1px 3px rgba(4,12,28,.95);
  }
  .disc-met   { animation: float-y 13s ease-in-out infinite; }
  .disc-ocean { animation: float-y 16s ease-in-out infinite; animation-delay:-4s; }
  .disc-hydro { animation: float-y 12s ease-in-out infinite; animation-delay:-7s; }
  .no-anim .disc-met, .no-anim .disc-ocean, .no-anim .disc-hydro{ animation: none; }

  /* Countdown */
  .cd-cell{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); backdrop-filter: blur(8px); }

  /* Topic icon ring */
  .ring-soft{ box-shadow: 0 0 0 6px rgba(96,192,240,.12); }

  /* Section heading underline */
  .h-rule{ display:inline-flex; align-items:center; gap:10px; font-size:12px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--c-ocean); }
  .h-rule::before{ content:''; width:36px; height:2px; background: var(--c-coral); }

  /* Agenda timeline */
  .tl-line{ background: linear-gradient(180deg, var(--c-sky), var(--c-ocean)); }



  /* ── Hero v6 — water cycle: atmosphere → river → ocean ───── */
  .wc-root{ background: radial-gradient(900px 520px at 78% 18%, rgba(27,78,143,.45), transparent 65%); }
  .wc-stars{ height:62%; opacity:.7;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 28% 8%, #cfe9ff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 44% 26%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 58% 12%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 66% 44%, #cfe9ff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 8% 52%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 36% 58%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 52% 70%, #cfe9ff 50%, transparent 51%),
      radial-gradient(1px 1px at 20% 36%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 62% 30%, #fff 50%, transparent 51%);
    -webkit-mask-image: linear-gradient(180deg,#000 55%,transparent); mask-image: linear-gradient(180deg,#000 55%,transparent);
    animation: wcTwinkle 7s ease-in-out infinite; }
  .wc-globe{ top:-7%; right:-13%; width:min(42vw, 620px); aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    box-shadow: 0 0 0 1px rgba(150,215,250,.35), 0 0 50px 8px rgba(96,192,240,.45), 0 0 140px 30px rgba(27,78,143,.45);
    animation: wcGlobe 40s ease-in-out infinite; }
  .wc-globe img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 62%; transform-origin:52% 58%;
    filter: saturate(1.1) brightness(.92) contrast(1.05); transform:scale(1.45); }
  .wc-globe-shade{ border-radius:50%;
    background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.14), transparent 40%), radial-gradient(circle at 36% 30%, transparent 52%, rgba(4,12,28,.55) 78%, rgba(4,12,28,.92) 100%); }
  .wc-flare{ top:calc(-7% + min(42vw,620px)*.06); right:calc(-13% + min(42vw,620px)*.66); width:180px; height:180px; transform:translate(50%,-50%);
    background: radial-gradient(circle, rgba(255,250,235,.95) 0 4%, rgba(255,210,150,.55) 10%, rgba(240,120,80,.18) 30%, transparent 62%); mix-blend-mode:screen; }
  .wc-land{ left:0; right:0; bottom:0; height:44%;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.55) 14%, #000 32%); mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.55) 14%, #000 32%); }
  .wc-land img{ position:absolute; top:0; height:100%; object-fit:cover; }
  .wc-river{ left:0; width:62%; object-position:40% 60%; filter: saturate(.75) hue-rotate(-8deg) brightness(.72) contrast(1.05);
    -webkit-mask-image: linear-gradient(90deg,#000 70%,transparent); mask-image: linear-gradient(90deg,#000 70%,transparent); }
  .wc-sea{ right:0; width:58%; object-position:42% 100%; transform-origin:40% 100%; filter: saturate(.9) brightness(.8);
    -webkit-mask-image: linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 18%,#000 36%); mask-image: linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 18%,#000 36%);
    animation: wcSea 30s ease-in-out infinite; }
  .wc-land-grade{ background: linear-gradient(180deg, rgba(8,28,58,.35), rgba(8,28,58,.05) 40%, rgba(8,28,58,.55) 100%); mix-blend-mode:multiply; }
  .wc-horizon{ left:0; right:0; bottom:calc(44% - 90px); height:200px;
    background: radial-gradient(60% 50% at 58% 60%, rgba(255,170,110,.38), rgba(240,120,80,.14) 45%, transparent 75%); mix-blend-mode:screen; }
  .wc-mist{ left:-20%; right:-20%; bottom:calc(44% - 70px); height:130px; opacity:.55; filter:blur(18px);
    background: radial-gradient(30% 45% at 20% 50%, rgba(220,235,250,.5), transparent 70%), radial-gradient(28% 40% at 55% 55%, rgba(220,235,250,.4), transparent 70%), radial-gradient(26% 42% at 85% 45%, rgba(220,235,250,.45), transparent 70%);
    animation: wcMist 46s linear infinite alternate; }
  .wc-textfade{ background: linear-gradient(90deg, rgba(8,28,58,.9) 0%, rgba(8,28,58,.75) 40%, rgba(8,28,58,.45) 58%, rgba(8,28,58,.12) 70%, transparent 78%);
    -webkit-mask-image: linear-gradient(180deg,#000 58%,transparent 80%); mask-image: linear-gradient(180deg,#000 58%,transparent 80%); }
  @media (max-width:767px){ .wc-land{ height:36%; } .wc-horizon{ bottom:calc(36% - 90px); } .wc-mist{ bottom:calc(36% - 70px); } }
  @keyframes wcGlobe{ 0%,100%{ transform:translate3d(0,0,0) } 50%{ transform:translate3d(-12px,10px,0) } }
  @keyframes wcSea{ 0%,100%{ transform:scale(1.6) translateX(0) } 50%{ transform:scale(1.66) translateX(-10px) } }
  @keyframes wcMist{ from{ transform:translateX(-6%) } to{ transform:translateX(6%) } }
  @keyframes wcTwinkle{ 0%,100%{ opacity:.7 } 50%{ opacity:.45 } }
  .no-anim .wc-sea{ transform:scale(1.6); } .no-anim .wc-globe, .no-anim .wc-mist, .no-anim .wc-stars{ animation:none; }
  @media (prefers-reduced-motion: reduce){ .wc-globe, .wc-sea, .wc-mist, .wc-stars{ animation:none !important; } }

  /* ── Hero collage (v4) — layered scientific composition, right column ───── */
  .hc-root{ --hc-navy:#081c3a; }
  .hc-root img{ position:absolute; object-fit:cover; }
  /* Layer 1 — khí quyển / bão vệ tinh: nền chính, choán góc trên phải */
  .hc-storm{
    top:-8%; right:-6%; width:46%; height:54%;
    -webkit-mask-image: radial-gradient(78% 80% at 66% 46%, #000 26%, rgba(0,0,0,.62) 52%, rgba(0,0,0,.22) 72%, transparent 88%);
            mask-image: radial-gradient(78% 80% at 66% 46%, #000 26%, rgba(0,0,0,.62) 52%, rgba(0,0,0,.22) 72%, transparent 88%);
    filter: saturate(.72) brightness(1.2) contrast(1.02) hue-rotate(-6deg);
    opacity:1; mix-blend-mode:screen;
    animation: hcDrift 26s ease-in-out infinite;
  }
  @media (max-width:1023px){
    .hc-storm{ top:-16%; width:40%; height:46%; }
    .hc-river{ top:20%; width:34%; height:36%; }
  }
  /* Layer 2 — lưu vực sông: chồng lấn ~1/3 lên ảnh bão, mềm mọi phía */
  .hc-river{
    top:22%; right:6%; width:40%; height:42%;
    -webkit-mask-image: radial-gradient(72% 76% at 52% 50%, #000 18%, rgba(0,0,0,.55) 46%, rgba(0,0,0,.18) 68%, transparent 86%);
            mask-image: radial-gradient(72% 76% at 52% 50%, #000 18%, rgba(0,0,0,.55) 46%, rgba(0,0,0,.18) 68%, transparent 86%);
    filter: saturate(.6) brightness(1.14) contrast(1.06) hue-rotate(-14deg);
    opacity:.85; mix-blend-mode:screen;
    animation: hcDrift 32s ease-in-out infinite; animation-delay:-9s;
  }
  /* Layer 5 — sea surface + observation buoy (foreground, sharper) */
  .hc-sea{
    bottom:0; right:-6%; width:50%; height:44%;
    -webkit-mask-image: radial-gradient(80% 90% at 62% 76%, #000 20%, rgba(0,0,0,.6) 48%, rgba(0,0,0,.2) 70%, transparent 88%);
            mask-image: radial-gradient(80% 90% at 62% 76%, #000 20%, rgba(0,0,0,.6) 48%, rgba(0,0,0,.2) 70%, transparent 88%);
    filter: saturate(.62) brightness(1.05) contrast(1.04) hue-rotate(-8deg);
    opacity:.88; mix-blend-mode:screen;
    animation: hcDrift 38s ease-in-out infinite; animation-delay:-16s;
  }
  .hc-buoy{
    bottom:4%; right:6%; width:15%; max-width:190px; aspect-ratio:200/260; opacity:.95;
    filter: drop-shadow(0 0 14px rgba(96,192,240,.35));
  }
  .hc-beam{ animation: hcTrack 9s linear infinite; }
  .hc-sig{ transform-origin:100px 46px; animation: hcSig 3.2s ease-in-out infinite; }
  @keyframes hcSig{ 0%,100%{ opacity:.15 } 50%{ opacity:.85 } }
  /* SVG data / model layers */
  .hc-radar{ top:26%; right:11%; width:27%; aspect-ratio:1/1; opacity:.5; mix-blend-mode:screen; }
  .hc-circ{ top:50%; right:1%; width:50%; opacity:1; mix-blend-mode:screen; }
  .hc-web { top:6%;  right:0;  width:44%; height:88%; opacity:.85; }
  .hc-flowline{ stroke-dasharray:40 300; animation: hcFlow 9s linear infinite; filter: drop-shadow(0 0 6px rgba(96,192,240,.5)); }
  .hc-node{ animation: hcPulse 3.4s ease-in-out infinite; }
  .hc-track{ stroke-dasharray:5 6; animation: hcTrack 14s linear infinite; }
  .hc-sweep{ transform-origin:200px 200px; animation: hcSweep 7s linear infinite; }
  @keyframes hcFlow  { to{ stroke-dashoffset:-326; } }
  @keyframes hcTrack { to{ stroke-dashoffset:-110; } }
  @keyframes hcSweep { to{ transform:rotate(360deg); } }
  @keyframes hcPulse { 0%,100%{ opacity:.35; r:2.6 } 50%{ opacity:1; r:4 } }
  @keyframes hcDrift { 0%,100%{ transform:translate3d(0,0,0) } 50%{ transform:translate3d(-10px,12px,0) } }
  /* uniform navy grade + fade toward the text column */
  .hc-grade{
    inset:0; left:26%;
    background: linear-gradient(180deg, rgba(8,28,58,.2), rgba(11,38,70,.08) 45%, rgba(8,28,58,.26));
    mix-blend-mode:multiply;
  }
  .hc-fade{
    inset:0;
    background: linear-gradient(90deg, rgba(8,28,58,.97) 0%, rgba(8,28,58,.95) 42%, rgba(8,28,58,.88) 58%, rgba(8,28,58,.72) 70%, rgba(8,28,58,.4) 82%, rgba(8,28,58,0) 94%);
  }
  /* thin annotations */
  .hc-anno{ display:flex; align-items:center; gap:8px; flex-direction:row-reverse; }
  .hc-anno-dot{ width:5px; height:5px; border-radius:50%; background:var(--c-sky); box-shadow:0 0 0 4px rgba(96,192,240,.16); flex:none; }
  .hc-anno-line{ height:1px; background:linear-gradient(90deg, rgba(96,192,240,0), rgba(96,192,240,.7)); flex:none; }
  .hc-anno-txt{ text-align:right; line-height:1.25; text-shadow:0 2px 12px rgba(4,12,28,.85); }
  .hc-anno-txt b{ display:block; font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.94); }
  .hc-anno-txt i{ display:block; font-style:normal; font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:rgba(150,215,250,.8); }
  .no-anim .hc-storm, .no-anim .hc-river, .no-anim .hc-sea, .no-anim .hc-flowline, .no-anim .hc-node, .no-anim .hc-track, .no-anim .hc-sweep, .no-anim .hc-beam, .no-anim .hc-sig{ animation:none; }
  @media (prefers-reduced-motion: reduce){
    .hc-storm, .hc-river, .hc-sea, .hc-flowline, .hc-node, .hc-track, .hc-sweep, .hc-beam, .hc-sig{ animation:none !important; }
  }

  /* Line clamp helpers */
  .clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .clamp-3{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  @media (max-width:767px){ .clamp-title{ -webkit-line-clamp:3; } }
  .abs-card{ transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s, border-color .35s; }
  .abs-card:hover{ transform: translateY(-4px); box-shadow: 0 24px 50px -20px rgba(10,46,92,.32); border-color: rgba(96,192,240,.6); }

  /* Skewed accent strip */
  .accent-strip{ background: var(--c-coral); }
</style>

<script type="text/babel">
// ===== sections-v5.jsx =====
// sections.jsx — Landing page sections for HMO Conference

// ───────────────────────── Icons (inline SVG) ─────────────────────────
const Icon = {
  Calendar: (p) =>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="3" y="5" width="18" height="16" rx="2" />

  Pin: (p) =>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d="M12 22s7-7.5 7-13a7 7 0 1 0-14 0c0 5.5 7 13 7 13z" />
      <circle cx="12" cy="9" r="2.5" />
    </svg>,

  Clock: (p) =>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
    </svg>,

  Mail: (p) =>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 7 9-7" />
    </svg>,

  Phone: (p) =>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z" />
    </svg>,

  Globe: (p) =>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
    </svg>,

// ───────────────────────── Reveal hook ─────────────────────────
function useReveal(opts = {}) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const show = () => {
      el.classList.add('in');
      const targets = el.classList.contains('reveal-stagger') ? el.children : [el];
      for (const n of targets) { n.style.opacity = '1'; n.style.transform = 'none'; }
    };
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            show();
            io.unobserve(el);
          }
        });
      },
      { threshold: opts.threshold ?? 0.15, rootMargin: opts.rootMargin ?? '0px 0px -60px 0px' }
    );
    io.observe(el);
    // fallback: nếu IntersectionObserver không kích hoạt (iframe, preview…),
    // vẫn hiện nội dung để trang không bao giờ trống chữ
    if (el.getBoundingClientRect().top < window.innerHeight) show();
    const t = setTimeout(show, 1200);
    return () => { clearTimeout(t); io.disconnect(); };
  }, []);
  return ref;
}

function StickyNav({ onCTA }) {
  const [scrolled, setScrolled] = React.useState(false);
  const [open, setOpen] = React.useState(false);
  const [active, setActive] = React.useState('hero');

  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 30);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  React.useEffect(() => {
    const ids = ['programme', 'abstracts', 'register', 'contact'];
    const io = new IntersectionObserver(
      (entries) => { entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); }); },
      { rootMargin: '-45% 0px -45% 0px' }
    );
    ids.forEach((id) => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);

  const links = [
  { id: 'programme', label: 'Programme' },
  { id: 'abstracts', label: 'Abstracts' },
  { id: 'contact', label: 'Contact' }];

  return (
    <header
      className={`fixed inset-x-0 top-0 z-40 transition-all duration-300 ${
      scrolled ? 'bg-white/95 backdrop-blur nav-shadow' : 'bg-transparent'}`
      }>

          {links.map((l) =>
          <a
            key={l.id}
            href={`#${l.id}`}
            className={`relative px-4 py-2 text-[13px] font-semibold tracking-wide rounded-full transition-colors ${
            scrolled ?
            active === l.id ? 'text-navy bg-mist' : 'text-slate-600 hover:text-navy' :
            active === l.id ? 'text-white bg-white/15' : 'text-white/85 hover:text-white'}`
            }>
              {l.label}
            </a>
          )}
        </nav>
        <div className="flex items-center gap-2">
          <button
            onClick={() => setOpen((v) => !v)}
            className={`lg:hidden p-2 rounded-md ${scrolled ? 'text-navy' : 'text-white'}`}
            aria-label="menu">
            {open ? <Icon.X className="w-6 h-6" /> : <Icon.Menu className="w-6 h-6" />}

        </div>

      <div

{
  no: 1, slot: '08:40', keynote: true,
  title: "Turbulence and Waves from Laboratory to Tropical Cyclones: Two Sides of the Same Coin",
  author: "Associate Professor Boris Galperin",
  affiliation: "College of Marine Sciences - University of South Florida (USA)",
  coauthors: [],
  photo: 'assets/speakers/01-square.png',
  bio: "Professor Boris Galperin graduated from the Latvian State University in 1975 and received his PhD from the Technion – Israel Institute of Technology in 1992. He accomplished his post-doctoral studies at Princeton University from 1993 to 1989, first at the Program of Atmospheric and Ocean Sciences/GFDL, and then at the Program for Applied and Computational Mathematics. He has been with the College of Marine Science, University of South Florida since 1989. Studies of turbulence in different environments have been among his main interests, and he has made important contributions in several areas. He was a co-developer of the Quasi-Normal Scale Elimination (QNSE) theory, a new analytical theory of turbulence. Applying this theory to stratified flows, he showed that the notion of the critical Richardson number is fallacious. He then derived the vertical kinetic energy spectra that were well known but never developed analytically. He investigated turbulence in flows with a beta-effect and discovered the regime of zonostrophic turbulence that governs the dynamics of the jets on giant planets. Turbulent flows with a constant Coriolis parameter develop the regime of peristrophic turbulence that is behind the atmospheric (Nastrom & Gage) and oceanic spectra. The analysis of the cyclostrophic turbulence in hurricanes reveals that their energy spectra in the eyewall undergoes the transition from the peristrophic to zonostrophic regimes, and this research opens new horizons in studies of tropical cyclones and severe weather. Earlier, Professor Galperin worked on simulations of circulation in Delaware and Tampa Bays, contributed to the development of the PORTS system predicting currents and elevations in Tampa Bay in near-real time, and did early research in hurricane-induced coastal floodings. He co-edited 3 books, one on Large-Eddy Simulation, with Professor Orszag from Princeton University, another one on Zonal Jets, with Professor Peter Read from the University of Oxford, and the last one was dedicated to Professor Jack Herring, with Drs Annick Pouquet and Peter Sullivan, both from the National Center for Atmospheric Research (NCAR). After only two years since its publication, the book has already collected about 100,000 views.",
  abstract: "Turbulence and waves are traditionally treated as distinct classes of fluid motion. In rotating geophysical flows, however, they coexist and interact over a remarkably broad range of scales. This talk explores the idea that turbulence and waves are not competing descriptions of geophysical flows, but two inseparable aspects of their dynamics. Starting from fundamental concepts of turbulence, rotation and wave–turbulence interaction, I will discuss how these ideas lead to quantitative predictions of atmospheric and oceanic kinetic-energy spectra and their observed universality. I will then consider the transition from nearly isotropic turbulence toward organized rotating flows, including zonal and annular structures, and examine observations from the atmosphere, ocean, laboratory experiments and tropical cyclones. Particular attention will be given to tropical and low-latitude environments, where the changing influence of planetary rotation provides an especially revealing test of the theory. Examples relevant to Vietnam—including monsoon-driven circulation, upwelling, turbulent mixing and tropical cyclones—illustrate how fundamental turbulence physics connects to ocean transport, environmental prediction and societally important marine processes. The broader message is that understanding geophysical turbulence requires understanding waves—and understanding waves requires understanding the turbulent environment in which they exist.",
},
{
  no: 2, slot: '09:20',
  title: "Insight into meteorological conditions triggering flash droughts in Vietnam",
  author: "Dr. Pham Thanh Ha",
  affiliation: "VNU University of Science, Hanoi",
  coauthors: [],
  photo: "assets/speakers/02-square.png",
  bio: "Dr. Pham Thanh Ha is a lecturer at the Department of Meteorology and Climate Change. Her research focuses on rainfall and rainfall forecasting, seasonal-to-subseasonal prediction, extreme weather events in Vietnam, and the application of statistical and machine learning/AI methods in meteorology.",
  abstract: "This study examines the characteristics and drivers of flash droughts (FD) and conventional droughts (CD) in Vietnam during 1961–2020 using the fifth generation ECMWF (ERA5) reanalysis data. FDs are distinguished from CDs based on the rate of decline in 60-cm root-zone soil moisture percentiles (RZSMp), with FD onset defined by the fastest 10% of drought onset durations at each grid point. Results reveal pronounced spatial heterogeneity: northern and southern sub-regions experience substantially faster drought onset (5–8 days) than central sub-regions (16–20 days). Although FD events are rare (< 1 event/decade) compared to more frequent CDs (6–12 events/decade), they are markedly more aggressive, with soil-moisture depletion rates exceeding 3%/day. Seasonality strongly modulates drought persistence. In northern and southern Vietnam, FD onset occurs predominantly during the warm and rainy season, facilitating rapid soil-moisture recovery and shorter event durations. In contrast, in central Vietnam, the mismatch between the warm season and peak rainfall leads to longer-lasting droughts. Analysis of meteorological drivers shows that FD onset is consistently associated with precipitation deficits (>93.5% of cases) and is predominantly intensified by enhanced evaporation (>59.5% of cases), indicating an evaporation-driven mechanism. However, this evaporative control is weaker in central sub-regions due to moisture limitations during the warm but dry season. Overall, these findings highlight strong regional contrasts in drought dynamics across Vietnam and emphasize the need for location-specific drought monitoring and risk management strategies that address both rapid-onset and prolonged drought hazards."
},
{
  no: 3, slot: '09:40',
  title: "Short-term flood forecasting using integrated radar-based and NWP rainfall forecasting: A case study of the Ma River basin",
  author: "Dr. Nguyen Hoang Minh",
  affiliation: "National Center for Hydro-Meteorological Forecasting",
  coauthors: [],
  photo: "assets/speakers/03-sq.png",
  bio: "Dr. Nguyen Hoang Minh is a hydrological expert. He is currently Vice Head of Natural Disaster Warning Division at Vietnam's National Center for Hydro-Meteorological Forecasting. Holding a Ph.D. from Sejong University, he won the 2021 WMO Research Award for Young Scientists. His work bridges academic research and operational flood forecasting using weather radar and NWP data.",
  abstract: "Short-term flood forecasting plays a vital role in natural disaster mitigation. However, relying exclusively on numerical weather prediction (NWP) models or ground gauge networks often suffers from spatial resolution constraints and quantitative bias. This study develops an integrated short-term flood forecasting technology combining Weather Research and Forecasting (WRF) NWP rainfall predictions with weather radar data, piloted in the Ma River basin, Vietnam. The workflow comprises two primary operational stages: simulation and forecasting. During the simulation phase, radar quantitative precipitation estimation (QPE) undergoes bias adjustment via a climatological method coupled with Kalman filtering technique. The refined radar QPE is then combined with observations from 72 ground raingauges using Kriging with External Drift (KED). In the forecasting phase, short-term radar quantitative precipitation forecasts (QPF radar) are integrated with WRF model outputs (QPF WRF) using an optimal weighting scheme based on the Critical Success Index (CSI) and Root Mean Square Error (RMSE) in the previous time step window. The resulting integrated precipitation dataset drives the MIKE NAM hydrological model for flood forecasting. Application results in the Ma River basin indicate that Kalman-filtered radar QPE significantly increases correlation coefficients while shifting mean error (ME) values close to zero. Hydrological runoff simulated from KED-blended precipitation achieves superior accuracy compared to individual rainfall inputs. For rainfall forecasting, integrated QPF increases CSI values by 8.77% to 26.83% (improvement percentage) and reduces RMSE across sub-basins relative to standalone WRF forecasts. Consequently, flood forecasting performance at Muong Lat station as well as Hua Na and Trung Son reservoirs improves significantly, with average Nash-Sutcliffe Efficiency (NSE) and Relative Error in Volume (REV) gains of 15.89% and 17.78%, respectively. These results have demonstrated the necessity of incorporating radar rainfall data into flood forecasting in Vietnam."
},
{
  no: 4, slot: '10:35',
  title: "From Variability to Uncertainty: Modeling the Red River Plume in the Gulf of Tonkin",
  author: "Dr. Nguyen Duy Tung",
  affiliation: "VNU University of Science, Hanoi",
  coauthors: [],
  photo: "assets/speakers/04-square.png",
  bio: "Dr. Nguyen Duy Tung obtained his PhD in Ocean–Atmosphere–Climate from the University of Toulouse, France, in 2022, with a thesis focusing on coastal dynamics and river plumes in the Gulf of Tonkin. He then conducted postdoctoral research within the DART project at the Oxford University Clinical Research Unit (OUCRU), which aimed to develop an early warning tool by integrating climate and clinical data. He is currently a lecturer at the University of Science, Vietnam National University Hanoi. His research interests include regional atmospheric and ocean modelling, climate change impacts and adaptation.",
  abstract: "The Red River is the dominant freshwater source to the Gulf of Tonkin, where its plume exhibits strong variability across daily, seasonal, and interannual timescales. This study investigates the dynamics of the Red River plume through high-resolution numerical modeling, with particular emphasis on its dominant spatial patterns and their sensitivity to wind-forcing uncertainty. Passive tracers are used to identify river-influenced waters, while K-means clustering is applied to characterize recurrent plume configurations and their associated forcing conditions. The results show that river discharge alone cannot explain plume variability, as monsoon winds, tides, and coastal circulation also play important roles. Distinct plume patterns are identified, ranging from narrow coastal distributions to broader offshore extensions under different forcing conditions. The robustness of these patterns is further examined using ensemble simulations generated by perturbing the atmospheric wind forcing. Wind uncertainty produces substantial variability in surface currents, salinity, plume area, thickness, and freshwater transport, with particularly strong responses in coastal regions and during periods of changing wind conditions. Despite these sensitivities, the dominant plume classification remains largely consistent across ensemble members, indicating that the main spatial patterns are relatively robust to wind-forcing uncertainty. Overall, the results highlight the combined importance of physical forcing and forcing uncertainty in interpreting and modeling river-plume variability in the Gulf of Tonkin."
},
{
  no: 5, slot: '10:55',
  title: 'Climate and Climate Change Information for the Health and Public Health Sector',
  author: 'Dr. Truong Ba Kien',
  affiliation: 'Viet Nam Institute of Meteorology, Hydrology, Environment and Marine Sciences (IMHEMS)',
  coauthors: [],
  photo: 'assets/speakers/05-square.png',
  bio: "Dr. Truong Ba Kien is Acting Deputy Director of the Center for Meteorology and Climate Research at the Viet Nam Institute of Meteorology, Hydrology, Environment and Marine Sciences (IMHEMS). He received his B.Sc. (2008) and M.Sc. in Meteorology from VNU University of Science, completed a research fellowship at the Leipzig Institute for Meteorology, Leipzig University, Germany (2013–2015), and earned his Ph.D. in Meteorology and Climatology in 2024. With more than 15 years of experience in meteorological and climate research, he has led and participated in numerous national and ministerial projects on heavy rainfall forecasting, typhoon prediction, climate change impacts, air quality forecasting, and operational weather forecasting systems for Viet Nam. His research interests include numerical weather prediction, extreme rainfall, tropical cyclones, air pollution modelling, climate projections, and artificial intelligence applications in weather and climate forecasting. He has authored and co-authored many papers in international journals such as Climate Dynamics, Climatic Change, and Journal of Water and Climate Change.",
  abstract: "Climate change is increasing public health risks through heatwaves, heavy rainfall, flooding, drought, air pollution, and shifts in the conditions that favour many infectious diseases. Climate information therefore needs to be integrated into health sector activities across multiple timescales, from current observations, short-range and seasonal forecasts to long-term climate change scenarios. Combining climate and environmental data with epidemiological data, the characteristics of vulnerable groups, and health system capacity can support risk mapping, impact-based early warning, and proactive resource allocation. The case of Hanoi shows that temperature, heat extremes, the urban heat island effect, and heat stress indices are all projected to increase in the future. Dengue fever risk also rises with global warming levels, with median increases of about 15% at 1.5°C, 27% at 2°C, and more than 50% at 3°C relative to the baseline period. Strengthening climate–health data integration, risk surveillance, early warning, and the development of climate-resilient health infrastructure is therefore needed to shift from reactive response to proactive risk management."

  title: "Evolving precipitation - baseflow transfer function under hydropower regulation: Diagnostics of non-stationary sensitivity in a monsoonal mountain basin",
  author: "Assoc. Prof. Dr. Nguyen Y Nhu",
  affiliation: "VNU University of Science, Hanoi",
  coauthors: [],
  photo: "assets/speakers/06-face.png",
  bio: "Dr. Nguyen Y Nhu is Head of the Department of Hydrology and Water Resources, VNU University of Science, Vietnam National University, Hanoi. Her research focuses on hydrological extremes and water-related impacts under climate change, land-use change and human activities.\n\nIn her flood research, Dr. Nhu is particularly interested in the uncertainty of runoff, inundation and flood damage processes. She uses hydrological and hydraulic models, data analysis methods and computational algorithms to simulate streamflow and inundation extent and to assess flood impacts on vulnerable areas. This work has also provided the foundation for extending her research to the two-way relationship between hydrological processes and human activities in flood risk management.\n\nMore recently, her research has increasingly focused on combining observations, physically based models and data-driven methods to clarify changes in streamflow and water balance under the combined influence of climate and socio-economic development. She is particularly interested in applying advanced statistics and machine learning to identify nonlinear relationships and to support forecasting and water-resource risk assessment.\n\nTo date, Dr. Nguyen Y Nhu has published 45 peer-reviewed scientific articles, has participated in and led numerous research projects on hydrology, floods and water resources, and maintains research collaborations with colleagues and institutions in Vietnam and abroad.",
  abstract: "Baseflow is a critical component of water resources in monsoonal mountain basins, sustaining dry-season river flow and downstream water availability. In the Lai Chau sub-basin of the Da River, precipitation variability associated with the El Niño–Southern Oscillation (ENSO) has coincided with progressive hydropower development over recent decades. However, whether reservoir regulation preserves, buffers, or amplifies the transmission of climatic variability into baseflow remains poorly understood. Here, we investigate changes in the precipitation–baseflow transfer function during 1980–2020 by examining variability across time scales, the persistence of precipitation-induced responses, and changes in precipitation elasticity. We show that baseflow retains a pronounced interannual component within the 2–5-year ENSO band throughout the study period. Nevertheless, its response to precipitation is largely contemporaneous and dissipates within approximately two years, suggesting limited multi-year hydrological memory. Moreover, baseflow behaviour shifts around 2008, broadly coinciding with intensified reservoir regulation, while precipitation elasticity declines during the initial regulation phase and increases thereafter. These contrasting responses indicate that the strength of precipitation–baseflow coupling changes across regulation regimes rather than remaining constant through time. Our findings reveal that hydropower regulation modifies, rather than removes, the transmission of climatic variability through the basin, demonstrating the need to represent non-stationary storage–release controls when assessing baseflow sensitivity in regulated monsoonal rivers."

        <div className="mt-7 bg-white rounded-3xl shadow-hi border border-slate-100 p-7 md:p-12">

// ───────────────────────── Registration (attendance only) ─────────────────────────
function Registration() {
  const ref = useReveal();
  const ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbwvjKGbLumzLjojISQVPG7PFxSmf-MiQ1JbASlBrknBE7IxeZQVIX6oQnXa04MXZw2_/exec';
  const MODES = [{ v: 'Trực tiếp', l: 'In person' }, { v: 'Trực tuyến', l: 'Online' }];
  const empty = { name: '', email: '', phone: '', org: '', title: '', mode: 'Trực tiếp' };
  const [form, setForm] = React.useState(empty);
  const [errors, setErrors] = React.useState({});
  const [sending, setSending] = React.useState(false);
  const [done, setDone] = React.useState(false);
  const [failed, setFailed] = React.useState(false);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Please enter your full name';
    if (!form.email.trim()) e.email = 'Please enter your email';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'Invalid email address';
    if (form.phone.trim() && !/^[0-9+\-\s()]{8,}$/.test(form.phone)) e.phone = 'Invalid phone number';
    if (!form.org.trim()) e.org = 'Please enter your organisation';
    setErrors(e);
    return Object.keys(e).length === 0;
  };
  const submit = async (ev) => {
    ev.preventDefault();
    setFailed(false);
    if (!validate()) return;
    setSending(true);
    try {
      await fetch(ENDPOINT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ hoTen: form.name, email: form.email, dienThoai: form.phone, donVi: form.org, chucDanh: form.title, hinhThuc: form.mode, tomTat: '', fileName: '', mimeType: '', fileData: '' })
      });
      setDone(true);
    } catch (err) { setFailed(true); } finally { setSending(false); }
  };
  const fieldCls = (k) => `w-full bg-white border ${errors[k] ? 'border-red-500' : 'border-slate-200'} rounded-xl px-4 py-3.5 text-[14px] text-slate-800 placeholder:text-slate-400 outline-none focus:border-ocean`;
  const lbl = 'block text-[12px] font-bold tracking-wider text-navy uppercase mb-2';
  const err = (k) => errors[k] && <div className="mt-1.5 text-[12px] text-red-600 font-medium">{errors[k]}</div>;
  return (
    <section id="register" className="relative py-24 md:py-28 bg-navy text-white overflow-hidden">
      <div className="relative max-w-7xl mx-auto px-5 md:px-8">
        <div ref={ref} className="reveal grid lg:grid-cols-12 gap-10 lg:gap-16 items-start">
          <div className="lg:col-span-5">
            <div className="text-[11px] font-bold tracking-[.22em] uppercase text-sky">Registration</div>
            <h2 className="mt-4 font-display font-black text-[34px] md:text-[44px] leading-[1.1] tracking-tight" style={{ textWrap: 'balance' }}>
              Register to <span className="text-sky">attend</span>
            </h2>
            <p className="mt-5 text-white/80 text-[15px] leading-relaxed max-w-md" style={{ textWrap: 'pretty' }}>
              Let us know whether you will join in person or online so the organising committee can plan seating and the online session.
            </p>
          </div>
          <div className="lg:col-span-7">
            <div className="bg-white text-slate-800 rounded-3xl p-7 md:p-10 shadow-hi">
              {!done ?
              <form onSubmit={submit} noValidate className="grid sm:grid-cols-2 gap-4">
                <div className="sm:col-span-2">
                  <label className={lbl}>Attendance *</label>
                  <div className="grid grid-cols-2 gap-2">
                    {MODES.map((m) =>
                    <button type="button" key={m.v} onClick={() => setForm({ ...form, mode: m.v })}
                      className={`px-3 py-3.5 rounded-xl border text-[14px] font-semibold transition ${form.mode === m.v ? 'bg-navy text-white border-navy' : 'bg-white text-slate-600 border-slate-200 hover:border-ocean hover:text-ocean'}`}>
                      {m.l}
                    </button>)}
                  </div>
                </div>
                <div className="sm:col-span-2">
                  <label className={lbl}>Full name *</label>
                  <input value={form.name} onChange={set('name')} className={fieldCls('name')} placeholder="e.g. Nguyen Van A" />
                  {err('name')}
                </div>
                <div>
                  <label className={lbl}>Email *</label>
                  <input type="email" value={form.email} onChange={set('email')} className={fieldCls('email')} placeholder="name@hus.edu.vn" />
                  {err('email')}
                </div>
                <div>
                  <label className={lbl}>Phone</label>
                  <input value={form.phone} onChange={set('phone')} className={fieldCls('phone')} placeholder="0xxx xxx xxx" />
                  {err('phone')}
                </div>
                <div>
                  <label className={lbl}>Organisation *</label>
                  <input value={form.org} onChange={set('org')} className={fieldCls('org')} placeholder="University / Institute / Agency" />
                  {err('org')}
                </div>
                <div>
                  <label className={lbl}>Title / Degree</label>
                  <input value={form.title} onChange={set('title')} className={fieldCls('title')} placeholder="e.g. Dr., Assoc. Prof., MSc." />
                </div>
                <div className="sm:col-span-2 mt-3 flex flex-col sm:flex-row items-center gap-4">
                  <button type="submit" disabled={sending} className="btn-coral inline-flex items-center justify-center gap-2 text-white font-bold text-sm tracking-[.18em] px-8 py-4 rounded-full w-full sm:w-auto disabled:opacity-60 disabled:cursor-not-allowed">
                    {sending ? 'SENDING…' : 'SUBMIT'}
                  </button>
                  {failed && <div className="text-[13px] text-red-600 font-medium">Could not send. Please try again or contact the organisers.</div>}
                </div>
              </form> :
              <div className="text-center py-8">
                <h3 className="font-display font-black text-[26px] text-navy">Thank you, {form.name}!</h3>
                <p className="mt-3 text-slate-600 text-[15px]">
                  Your registration to attend <strong>{MODES.find((m) => m.v === form.mode).l.toLowerCase()}</strong> has been received.
                </p>
                <button onClick={() => { setForm(empty); setErrors({}); setDone(false); }} className="mt-7 text-ocean hover:text-navy font-semibold text-sm">
                  Register another person
                </button>
              </div>}
            </div>
          </div>
        </div>
      </div>
    </section>);
}

Object.assign(window, { Programme, PROGRAMME_CHAIRS, ABSTRACTS, Abstracts, AbstractDetail, SpeakerAvatar, initialsOf, Registration });

</script>
<script type="text/babel">
// ===== app =====
// app-v5.jsx — English abstracts version

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": ["#0A2E5C", "#1B4E8F", "#60C0F0", "#F07850"],
  "animations": true,
  "bgImage": "https://images.unsplash.com/photo-1505142468610-359e7d316be0?auto=format&fit=crop&w=2400&q=80",
  "theme": "Interdisciplinary integration across meteorology, hydrology and oceanography for applied science and technology",
  "date": "30 / 09 / 2026",
  "location": "334 Nguyen Trai, Thanh Xuan, Hanoi"
}/*EDITMODE-END*/;

const BG_IMAGES = [
  "https://images.unsplash.com/photo-1505142468610-359e7d316be0?auto=format&fit=crop&w=2400&q=80",
  "https://images.unsplash.com/photo-1532619675605-1ede6c2ed2b0?auto=format&fit=crop&w=2400&q=80",
  "https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=2400&q=80",
  "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=80",
];

const PALETTES = [
  ["#0A2E5C", "#1B4E8F", "#60C0F0", "#F07850"],
  ["#0B3D2E", "#176E4A", "#7BD3B0", "#F2A766"],
  ["#1A1A40", "#3D348B", "#7678ED", "#F7B801"],
  ["#1A2A33", "#37474F", "#4DD0E1", "#FF7043"],
];

function App() {
  const t = TWEAK_DEFAULTS;
  const [view, setView] = React.useState(null); // null = list page, number = abstract no
  const scrollMemo = React.useRef(0);

  React.useEffect(() => {
    const [navy, ocean, sky, coral] = t.palette || PALETTES[0];
    const r = document.documentElement.style;
    r.setProperty('--c-navy', navy);
    r.setProperty('--c-ocean', ocean);
    r.setProperty('--c-sky', sky);
    r.setProperty('--c-coral', coral);
  }, [t.palette]);

  React.useEffect(() => {
    document.body.classList.toggle('no-anim', !t.animations);
  }, [t.animations]);

  const pendingScroll = React.useRef(null);
  const jump = (y) => window.scrollTo({ top: y, left: 0, behavior: 'instant' });

  React.useLayoutEffect(() => {
    if (pendingScroll.current === null) return;
    const p = pendingScroll.current;
    pendingScroll.current = null;
    const target = () => {
      if (typeof p === 'number') return p;
      const el = document.getElementById(p);
      return el ? el.getBoundingClientRect().top + window.scrollY - 68 : 0;
    };
    jump(target());
    requestAnimationFrame(() => jump(target()));
  }, [view]);

  React.useEffect(() => {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    const m = location.hash.match(/^#abstract-(\d+)$/);
    if (m && ABSTRACTS.some((a) => a.no === +m[1])) { history.replaceState({ no: null }, '', location.pathname); history.pushState({ no: +m[1] }, '', '#abstract-' + m[1]); pendingScroll.current = 0; setView(+m[1]); }
    const onPop = (e) => {
      const no = e.state && e.state.no != null ? e.state.no : null;
      const h = location.hash.slice(1);
      if (no === null && h && !h.startsWith('abstract-')) pendingScroll.current = h;
      else pendingScroll.current = no === null ? scrollMemo.current : 0;
      setView(no);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const openAbstract = (no) => {
    scrollMemo.current = window.scrollY;
    history.pushState({ no }, '', '#abstract-' + no);
    pendingScroll.current = 0;
    setView(no);
  };

  const backToList = () => {
    if (history.state && history.state.no != null) { history.back(); return; }
    pendingScroll.current = scrollMemo.current;
    setView(null);
  };

  React.useEffect(() => { window.__goHome = backToList; }, []);

  const scrollToAbstracts = () => {
    if (view !== null) { backToList(); return; }
    const el = document.getElementById('abstracts');
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 68, behavior: 'smooth' });
  };

  const item = view === null ? null : ABSTRACTS.find((a) => a.no === view);

  return (
    <div className="relative">
      <StickyNav onCTA={scrollToAbstracts} />
      {item ?
      <AbstractDetail item={item} onBack={backToList} /> :
      <>
        <Hero
          theme={t.theme}
          dateLabel={t.date}
          locationLabel={t.location}
          onCTA={scrollToAbstracts}
          bgImage={t.bgImage}
        />
        <Intro />
        <Programme onOpen={openAbstract} />
        <Abstracts onOpen={openAbstract} />
        <Registration />
        <Contact />
      </>}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
